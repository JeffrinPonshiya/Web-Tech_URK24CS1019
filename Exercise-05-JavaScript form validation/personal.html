
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #FBEFEF;
            color: #CF4173;
            font-family: "Times New Roman", Times, serif;
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            color: #92003A;
            font-size: 34px;
            margin: 10px 0 20px;
        }

        hr {
            width: 75%;
            border: none;
            border-top: 2px solid #92003A;
            margin: 20px auto 28px;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #92003A;
            margin-bottom: 20px;
        }

        .details-card {
            max-width: 750px;
            margin: 0 auto;
            background-color: #FFF9FA;
            border: 1px solid #E9A8BF;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(146, 0, 58, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #FFF9FA;
        }

        th,
        td {
            border: 1px solid #E9A8BF;
            padding: 14px 12px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        th {
            width: 32%;
            color: #92003A;
            background-color: #F8E3EA;
        }

        td {
            color: #CF4173;
        }

        tbody tr:nth-child(even) {
            background-color: #F8E3EA;
        }

        tbody tr:hover {
            background-color: #F2D4E0;
        }

        .home-link {
            display: inline-block;
            margin: 28px auto 10px;
            padding: 11px 26px;
            background-color: #92003A;
            color: white;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .home-link:hover {
            background-color: #5D3140;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 27px;
            }

            .profile-img {
                width: 145px;
                height: 145px;
            }

            .details-card {
                padding: 10px;
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 14px;
            }

            th {
                width: 35%;
            }

            hr {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1><i>PERSONAL DETAILS</i></h1>

    <hr>

    <img
        src="profile.jpg"
        alt="Jeffrin Ponshiya"
        class="profile-img"
    >

    <div class="details-card">

        <table>
            <tbody>
                <tr>
                    <th>Name</th>
                    <td>Jeffrin Ponshiya M</td>
                </tr>

                <tr>
                    <th>Profession</th>
                    <td>Freelance Web Developer</td>
                </tr>

                <tr>
                    <th>Qualification</th>
                    <td>B.Tech CSE</td>
                </tr>

                <tr>
                    <th>College</th>
                    <td>Karunya Institute of Technology and Sciences</td>
                </tr>

                <tr>
                    <th>Location</th>
                    <td>Coimbatore, Tamil Nadu</td>
                </tr>

                <tr>
                    <th>Email</th>
                    <td>
                        <a href="mailto:jeffrinponshiya@karunya.edu.in"
                           style="color: #92003A;">
                            jeffrinponshiya@karunya.edu.in
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <a href="index.html" class="home-link">
        &#8592; Back to Home
    </a>

</body>
</html>
