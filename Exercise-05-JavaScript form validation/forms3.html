<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Technical Requirements</title>

    <style>

        body{
            background-color:#FBEFEF;
            color:#CF4173;
            font-family:"Times New Roman", Times, serif;
            text-align:center;
        }

        h1{
            color:#92003A;
        }

        table{
            margin:auto;
        }

        td{
            padding:10px;
            text-align:left;
            vertical-align:top;
        }

        input,
        textarea{
            padding:7px;
            border:2px solid #CF4173;
            border-radius:8px;
            background-color:#FFF9FA;
            font-family:"Times New Roman", Times, serif;
        }

        /* :focus */

        input:focus,
        textarea:focus{
            border:2px solid #92003A;
            background-color:#FFFFFF;
            outline:none;
        }

        /* :required */

        input:required,
        textarea:required{
            background-color:#FFF9FA;
        }

        /* :valid */

        textarea:valid{
            border-color:#CF4173;
        }

        /* :invalid */

        textarea:invalid{
            border-color:#CF4173;
        }

        a{
            color:#92003A;
            text-decoration:none;
        }

        a:hover{
            color:#5D3140;
        }

        .button{
            padding:7px 15px;
            background-color:#92003A;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .button:hover{
            background-color:#5D3140;
        }

        @media (max-width:600px){

            h1{
                font-size:24px;
            }

            table{
                width:95%;
                max-width:95%;
                margin:auto;
                table-layout:fixed;
            }

            td{
                font-size:14px;
                word-wrap:break-word;
                overflow-wrap:break-word;
            }

            input,
            textarea{
                max-width:100%;
                box-sizing:border-box;
            }

        }

    </style>

</head>

<body>

    <h1><i>TECHNICAL REQUIREMENTS</i></h1>

    <h4>Step 3 of 3</h4>

    <hr width="60%" color="#92003A">

    <br>

    <form>

        <table>

            <tr>

                <td>
                    <b>Services Required</b>
                </td>

                <td>

                    <input type="checkbox">
                    Web Design

                    <br>

                    <input type="checkbox">
                    Frontend Development

                    <br>

                    <input type="checkbox">
                    Backend Development

                    <br>

                    <input type="checkbox">
                    Website Maintenance

                </td>

            </tr>

            <tr>

                <td>
                    <b>Preferred Contact</b>
                </td>

                <td>

                    <input
                        type="radio"
                        name="contact">
                    Email

                    <input
                        type="radio"
                        name="contact">
                    Phone

                    <input
                        type="radio"
                        name="contact">
                    WhatsApp

                </td>

            </tr>

            <tr>

                <td>
                    <b>Upload Reference File</b>
                </td>

                <td>

                    <input type="file">

                </td>

            </tr>

            <tr>

                <td>
                    <b>Notes</b>
                </td>

                <td>

                    <textarea
                        rows="4"
                        cols="25"
                        placeholder="Enter Additional Notes"></textarea>

                </td>

            </tr>

            <tr>

                <td colspan="2" align="center">

                    <a href="forms2.html">

                        <input
                            class="button"
                            type="button"
                            value="Previous">

                    </a>

                    &nbsp;&nbsp;

                    <input
                        class="button"
                        type="submit"
                        value="Submit">

                </td>

            </tr>

        </table>

    </form>

    <br>

    <a href="index.html">
        <b>Back to Home</b>
    </a>

</body>

</html>
