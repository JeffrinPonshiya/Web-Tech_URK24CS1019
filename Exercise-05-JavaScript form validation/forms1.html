<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Details</title>

    <style>

        body{
            background-color:#FBEFEF;
            color:#CF4173;
            font-family:"Times New Roman", Times, serif;
            text-align:center;
        }

        h1{
            color:#92003A;
        }

        table{
            margin:auto;
        }

        td{
            padding:10px;
            text-align:left;
        }

        label{
            font-weight:bold;
        }

        input{
            padding:7px;
            border:2px solid #CF4173;
            border-radius:8px;

            /* Clean minimal input background */
            background-color:#FFF9FA;
        }

        /* Adjacent Sibling Selector */
        label + input{
            background-color:#FFF9FA;
        }

        /* :focus */
        input:focus{
            border:2px solid #92003A;
            background-color:#FFFFFF;
            outline:none;
        }

        /* :required */
        input:required{
            background-color:#FFF9FA;
        }

        /* :valid */
        input[type="email"]:valid{
            border:2px solid #CF4173;
            color:#92003A;
        }

        /* :invalid */
        input[type="email"]:invalid{
            border:2px solid #CF4173;
            color:#92003A;
        }

        a{
            color:#92003A;
            text-decoration:none;
        }

        a:hover{
            color:#5D3140;
        }

        .button{
            padding:7px 15px;
            background-color:#92003A;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .button:hover{
            background-color:#5D3140;
        }

        @media (max-width:600px){

            h1{
                font-size:24px;
            }

            table{
                width:95%;
                max-width:95%;
                margin:auto;
                table-layout:fixed;
            }

            td{
                font-size:14px;
                word-wrap:break-word;
                overflow-wrap:break-word;
            }

            input{
                max-width:100%;
                box-sizing:border-box;
            }

        }

    </style>

</head>

<body>

    <h1><i>PERSONAL DETAILS</i></h1>

    <h4>Step 1 of 3</h4>

    <hr width="60%" color="#92003A">

    <br>

    <form>

        <table>

            <tr>

                <td>
                    <label>Full Name</label>
                </td>

                <td>
                    <input
                        type="text"
                        placeholder="Enter your Name"
                        required>
                </td>

            </tr>

            <tr>

                <td>
                    <label>Email</label>
                </td>

                <td>
                    <input
                        type="email"
                        placeholder="Enter your Email"
                        required>
                </td>

            </tr>

            <tr>

                <td>
                    <label>Phone Number</label>
                </td>

                <td>
                    <input
                        type="tel"
                        placeholder="Enter your Phone"
                        required>
                </td>

            </tr>

            <tr>

                <td>
                    <label>Company Name</label>
                </td>

                <td>
                    <input
                        type="text"
                        placeholder="Optional">
                </td>

            </tr>

            <tr>

                <td>
                    <label>Location</label>
                </td>

                <td>
                    <input
                        type="text"
                        placeholder="City"
                        required>
                </td>

            </tr>

        </table>

        <br>

        <a href="forms2.html">

            <input
                class="button"
                type="button"
                value="Next">

        </a>

    </form>

    <br>

    <a href="index.html">
        <b>Back to Home</b>
    </a>

</body>

</html>
